# 工作流名称：发布到 npm
# 功能说明：该工作流用于自动化将 wot-ui-plus 组件库发布到 npm 包管理平台
# 触发条件：当推送符合 v* 模式的标签时自动执行（如 v1.0.0, v2.1.3 等）
name: Publish to npm

# 工作流触发条件配置
on:
  push:
    tags:
      - 'v*' # 匹配所有以 v 开头的标签，如 v1.0, v20.15.10 等版本标签

# 定义工作流作业
jobs:
  # 作业名称：publish
  # 功能：执行 npm 包的构建与发布流程
  publish:
    # 运行环境：使用最新版 Ubuntu 虚拟机
    runs-on: ubuntu-latest
    
    # 作业步骤列表
    steps:
      # 步骤 1：检出代码
      # 功能：将当前仓库的代码检出到 GitHub Actions 运行环境中
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2：设置 Node.js 环境
      # 功能：配置发布所需的 Node.js 版本和 npm 注册表
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 指定使用 Node.js v20 版本
          registry-url: https://registry.npmjs.org # 设置 npm 注册表为官方源

      # 步骤 3：安装依赖
      # 功能：安装项目依赖和构建工具
      - name: Install Dependencies
        run: |
          npm install pnpm -g # 全局安装 pnpm 包管理器
          pnpm install # 使用 pnpm 安装项目依赖

      # 步骤 4：构建 Web Types
      # 功能：生成组件库的 Web Types 定义文件，用于编辑器自动补全和类型提示
      - name: Run Build WEB TYPES
        run: pnpm build:web-types

      # 步骤 5：运行编译器
      # 功能：编译组件库代码，生成发布所需的构建产物（通常在 lib 目录下）
      - name: Run Compiler
        run: pnpm compiler

      # 步骤 6：发布包
      # 功能：将构建好的组件库发布到 npm 注册表
      - name: Publish Package
        run: |
          cd lib # 进入构建产物目录
          npm publish # 执行 npm 发布命令
        env:
          # 设置 npm 认证令牌，用于 npm 注册表的身份验证
          # 令牌值从 GitHub Secrets 中获取，确保安全性
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}