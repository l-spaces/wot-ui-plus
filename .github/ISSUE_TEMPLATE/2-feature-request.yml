name: 新功能征集 
description: 创建一个 Issue 描述一下你的功能需求。
title: "[新功能征集] 标题"
labels: ["feature: need confirm"]
body:
  - type: markdown
    attributes:
      value: |
        在提交功能需求前，请注意：

        - 确认这是一个通用功能，并且无法通过现有的 API 或 Slot 实现。
        - 尝试在 [Issue](https://github.com/l-spaces/wot-ui-plus/issues)列表中搜索，并且没有发现同样的需求。
        - 可以先到 [Discussions 讨论区](https://github.com/l-spaces/wot-ui-plus/discussions) 发帖，讨论一下需求是否合理。
        - 请确保描述清楚你的需求，以便其他开发者更好地理解你的需求。

  - type: markdown
    attributes:
      value: |
        感谢您关注 wot ui plus 我们欢迎开发者和用户为框架提出新功能建议。请详细描述您希望添加的功能、预期的使用场景，以及该功能将如何提升开发体验或解决实际问题。我们会认真评估每一条建议，并根据实际情况进行规划和实现

  - type: textarea
    id: requirement
    attributes:
      label: 1. 提交要求？
      description: 请尽可能详细地说明这个功能的使用场景。
      placeholder: |
        - **功能描述**：简要说明您希望实现的功能是什么。
        - **使用场景**：举例说明该功能在实际项目中的应用场景或痛点。
        - **期望效果**：描述该功能实现后，开发者或用户将获得哪些便利。
        - **API 设计（可选）**：如有具体 API 或用法建议，请一并提供。
        - **相关资料（可选）**：如有参考的其他框架、设计稿、交互原型等，请附上链接或截图。
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 2. 使用场景举例
      description: 请尽可能详细地说明这个功能的使用场景。
      placeholder: |
        - 需要支持某类业务常用的 UI 组件（如时间轴、甘特图、数据可视化等）
        - 希望增强现有组件的某些能力（如表单校验、国际化、无障碍支持等）
        - 期望提供更灵活的主题定制、暗黑模式、响应式布局等
        - 希望集成第三方服务（如地图、支付、消息推送等）
        - 其他能提升开发效率或用户体验的创新点
    validations:
      required: true

